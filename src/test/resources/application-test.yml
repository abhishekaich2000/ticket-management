
spring:
  docker:
    compose:
      enabled: false
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:ticket_app_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      "[hibernate.dialect]": org.hibernate.dialect.H2Dialect
  rabbitmq:
    listener:
      simple:
        auto-startup: false
    template:
      mandatory: false

jwt:
  secret: abcdefghijklmnopQRSTqxYZ11234567890

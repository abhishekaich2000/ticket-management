services:

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticket_management
    ports:
      - 5432:5432
    volumes:
      - ./postgres_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4.3.6-management
    ports:
      - 5672:5672
      - 15672:15672